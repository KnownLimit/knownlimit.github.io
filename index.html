<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Known Limit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }
        .container img {
            max-width: 100%;
            max-height: 500px;
            width: auto;
            height: auto;
        }
        .email-link, .copyright {
            position: absolute;
            text-align: center;
            width: 100%;
        }
        .email-link {
            bottom: 40px;
        }
        .email-link a {
            color: #000;
            text-decoration: none;
            font-size: 18px;
        }
        .copyright {
            bottom: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="container">
        <img src="media/KnownLimit_Logo.png" alt="Centered Image">
    </div>
    <div class="email-link">
        <a href="mailto:info@knownlimit.com">Inquiries: info@knownlimit.com</a>
    </div>
    <div class="copyright">
        &copy; <script>document.write(new Date().getFullYear());</script> Known Limit LLC. All rights reserved.
    </div>
</body>
</html>
